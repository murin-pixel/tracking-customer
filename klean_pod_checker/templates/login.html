<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>เข้าสู่ระบบ · BeDee Fulfilment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v='20260717b') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <img class="login-logo" src="{{ url_for('static', filename='bedee-logo.png', v='20260717') }}" alt="BeDee Powered by BDMS">
      <p class="eyebrow">BEDEE FULFILMENT · CS TOOL</p>
      <h1>ระบบตรวจสอบสถานะจัดส่ง</h1>
      <p class="subtle">ใส่ PIN สำหรับทีม CS เพื่อเริ่มตรวจเลขออเดอร์</p>
      {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
      <form method="post" class="login-form">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label for="pin">PIN เข้าใช้งาน</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" autofocus required>
        <button class="primary-button" type="submit">เข้าสู่ระบบ</button>
      </form>
      <p class="privacy-note">ระบบจะไม่แสดงรหัสผ่าน Skyfrog ให้ผู้ใช้งาน</p>
    </section>
  </main>
</body>
</html>
